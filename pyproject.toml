[project]
name = "diplomski-mra-synthesis"
version = "1.0.0"
description = "Topologically constrained latent adversarial diffusion for 3D TOF-MRA synthesis from T1/T2/PD (IXI)"
requires-python = ">=3.12,<3.13"
# Pinned to the environment the thesis results were produced with.
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "SimpleITK==2.5.3",
    "nibabel==5.4.2",
    "nipreps-synthstrip==0.0.1",
    "matplotlib==3.10.8",
    "tqdm==4.67.3",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pyflakes==3.4.0"]

[tool.uv]
package = false
# Transitive packages pinned to the installed environment, so `uv run` never upgrades it.
constraint-dependencies = [
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "filelock==3.20.0",
    "fonttools==4.62.0",
    "fsspec==2025.12.0",
    "h5py==3.16.0",
    "imageio==2.37.3",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "kiwisolver==1.5.0",
    "lazy-loader==0.5",
    "markupsafe==3.0.2",
    "matplotlib==3.10.8",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nibabel==5.4.2",
    "nipreps-synthstrip==0.0.1",
    "nitransforms==25.1.0",
    "numpy==2.4.3",
    "packaging==26.0",
    "pillow==12.1.1",
    "pluggy==1.6.0",
    "pyflakes==3.4.0",
    "pygments==2.19.2",
    "pyparsing==3.3.2",
    "pytest==9.0.2",
    "python-dateutil==2.9.0.post0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "setuptools==70.2.0",
    "simpleitk==2.5.3",
    "six==1.17.0",
    "sympy==1.14.0",
    "tifffile==2026.3.3",
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
    "tqdm==4.67.3",
    "typing-extensions==4.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
